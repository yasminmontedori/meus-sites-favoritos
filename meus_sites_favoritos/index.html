
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Configuração dos caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptação para celulares e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilização da página com CSS -->
    <style>

        /* Configurações gerais da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #fceef3;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Título principal da página */
        h1 {
            color: #a64d79;
        }

        /* Organização dos cartões */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        /* Aparência dos cartões dos sites */
        .site {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #d8b9c5;
        }

        /* Nome de cada site */
        .site h2 {
            color: #a64d79;
        }

        /* Configuração das imagens */
        .site img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        /* Aparência dos links */
        .site a {
            display: inline-block;
            margin-top: 15px;
            color: #a64d79;
            font-weight: bold;
            text-decoration: none;
        }

        /* Efeito ao passar o mouse sobre os links */
        .site a:hover {
            color: #e17ba8;
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <!-- Título principal do corpo da página -->
    <h1>Meus sites favoritos: Yasmin Montedori</h1>

    <!-- Pequena apresentação -->
    <p>Confira alguns dos meus sites favoritos!</p>

    <!-- Container que organiza os cinco sites -->

    <div class="container">

        <!-- Primeiro site: Google -->
        <div class="site">

            <h2>Google</h2>

            <!-- Imagem clicável do Google -->
            <a href="https://www.google.com" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=google.com&sz=256"
                alt="Logo do Google">
            </a>

            <!-- Link para acessar o Google -->
            <a href="https://www.google.com" target="_blank">
                Acessar site
            </a>

        </div>

        <!-- Segundo site: YouTube -->
        <div class="site">

            <h2>YouTube</h2>

            <!-- Imagem clicável do YouTube -->
            <a href="https://www.youtube.com" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=256"
                alt="Logo do YouTube">
            </a>

            <!-- Link para acessar o YouTube -->
            <a href="https://www.youtube.com" target="_blank">
                Acessar site
            </a>

        </div>

        <!-- Terceiro site: Canva -->
        <div class="site">

            <h2>Canva</h2>

            <!-- Imagem clicável do Canva -->
            <a href="https://www.canva.com" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=canva.com&sz=256"
                alt="Logo do Canva">
            </a>

            <!-- Link para acessar o Canva -->
            <a href="https://www.canva.com" target="_blank">
                Acessar site
            </a>

        </div>

        <!-- Quarto site: GitHub -->
        <div class="site">

            <h2>GitHub</h2>

            <!-- Imagem clicável do GitHub -->
            <a href="https://github.com" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=github.com&sz=256"
                alt="Logo do GitHub">
            </a>

            <!-- Link para acessar o GitHub -->
            <a href="https://github.com" target="_blank">
                Acessar site
            </a>

        </div>

        <!-- Quinto site: ChatGPT -->
        <div class="site">

            <h2>ChatGPT</h2>

            <!-- Imagem clicável do ChatGPT -->
            <a href="https://chatgpt.com" target="_blank">
                <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=256"
                alt="Logo do ChatGPT">
            </a>

            <!-- Link para acessar o ChatGPT -->
            <a href="https://chatgpt.com" target="_blank">
                Acessar site
            </a>

        </div>

    </div>

</body>
</html>
